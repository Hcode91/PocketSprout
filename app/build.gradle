plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hcode91.didjdroid'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hcode91.didjdroid'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3 -fexceptions' ; arguments '-DANDROID_STL=c++_static' }
        }
    }

    buildTypes {
        debug {
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
