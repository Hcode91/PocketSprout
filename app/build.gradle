plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hcode91.pocketsprout'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hcode91.pocketsprout'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -O3 -fexceptions' ; arguments '-DANDROID_STL=c++_static' }
        }
    }

    // A fixed key checked into the repo, so every CI build installs over the last one.
    signingConfigs {
        shared {
            storeFile file('pocketsprout-ci.keystore')
            storePassword 'android'
            keyAlias 'app'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt' }
    }

    testOptions { unitTests { includeAndroidResources = true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Only for rendering the tutorial screenshots (gradle :app:testDebugUnitTest --tests '*Screenshots*').
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
